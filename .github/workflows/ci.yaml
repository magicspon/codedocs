name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Spellcheck
        run: pnpm spell-check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Coverage rather than a bare `pnpm test`: same run, plus the thresholds
      # in `vitest.config.ts`, so a drop fails here instead of going unnoticed.
      - name: Test
        run: pnpm test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

      # ADR 0011's invariant over the dependency closure. Its own step so the
      # failure names itself: `pnpm test` covers it too, but a red "Test" says
      # nothing about a dependency that started reaching the network.
      - name: No network
        run: pnpm check:network
