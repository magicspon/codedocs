name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Spellcheck
        run: pnpm spell-check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # The first CI step that starts an app. `pnpm build` filters to
      # `./packages/*`, so `apps/*` is otherwise only typechecked — and the e2e
      # app has no build step at all: it is one HTML file and a node server.
      - name: Install browsers
        run: pnpm --filter @homelync/e2e-example exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm e2e
