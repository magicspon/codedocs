name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Publishing to GitHub Packages. Without this the job's GITHUB_TOKEN is
      # read-only for packages and `changeset publish` fails on 403.
      packages: write

    steps:
      # This workflow is not `workflow_call`, so it cannot declare
      # `secrets: required: true` the way publish-package.yaml does. An org
      # secret that is not granted to this repo resolves to an empty string, so
      # assert it here rather than letting the release fail four steps later.
      - name: Check bot PAT is available
        env:
          PAT: ${{ secrets.HOMELINK_BOT_WORKFLOWS_PAT }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::error::HOMELINK_BOT_WORKFLOWS_PAT is empty. Grant the org secret to homelync/mocker."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Changesets needs full history to work out what has already been released.
          fetch-depth: 0
          # A PAT (not GITHUB_TOKEN) so the version PR triggers downstream workflows
          # — a branch pushed with GITHUB_TOKEN raises no pull_request event, so the
          # required checks on the version PR would never start.
          # HOMELINK_BOT_WORKFLOWS_PAT needs repo scope (contents + pull requests);
          # the registry token stays registry-only and is never handed to git.
          token: ${{ secrets.HOMELINK_BOT_WORKFLOWS_PAT }}

      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: pnpm
          # We publish to GitHub Packages, not npmjs. This is what writes the
          # `//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}` line, so the
          # host here must match `publishConfig.registry` in every package or
          # the publish goes out unauthenticated.
          registry-url: https://npm.pkg.github.com
          # Adds the `@homelync:registry` line as well, so installs during this
          # job resolve the workspace scope to GitHub too.
          scope: '@homelync'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # With pending changesets: opens/updates the version PR.
      # With none (i.e. that PR just merged): publishes the versioned packages.
      - name: Create release PR or publish
        # Pinned to a commit SHA: changesets/action ships no immutable major tag,
        # so `@v2` tracks a moving branch head. Comment records the release pinned.
        uses: changesets/action@198f833dd7d863100ea6e28967bc9a9fdefadb0a # v2.1.0
        with:
          # v2 reads the token from this input only — setting a GITHUB_TOKEN env
          # var is silently ignored and the action falls back to the read-only
          # default token, which fails on "Resource not accessible by integration".
          github-token: ${{ secrets.HOMELINK_BOT_WORKFLOWS_PAT }}
          # `version-packages`, not a bare `changeset version`: changeset version
          # writes package.json only, so the lockfile would keep reporting the
          # previous version forever. The script re-syncs it.
          version-script: pnpm run version-packages
          publish-script: pnpm run release
          commit-message: 'chore: version packages'
          pr-title: 'changeset: cut release'
        env:
          # GitHub Packages accepts the job's own token, so there is no npm
          # secret to rotate. It can only write packages owned by this repo's
          # owner — which is why the scope (`@homelync`) has to match the org.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
