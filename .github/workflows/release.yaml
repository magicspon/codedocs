name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # npm provenance signs the published tarball with this run's identity, so
      # a reader can tie the package on the registry back to the commit here.
      id-token: write

    steps:
      # Two secrets do two different jobs, and neither substitutes for the
      # other. An empty org secret resolves to an empty string rather than
      # failing, so assert both here instead of letting the release fail four
      # steps later with an authentication error that names neither.
      - name: Check release secrets are available
        env:
          GIT_PAT: ${{ secrets.RELEASE_PAT }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$GIT_PAT" ]; then
            echo "::error::RELEASE_PAT is empty. It needs contents + pull-requests scope on magicspon/codedocs."
            exit 1
          fi
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN is empty. It needs publish rights on the @codedocs scope at registry.npmjs.org."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Changesets needs full history to work out what has already been released.
          fetch-depth: 0
          # A PAT rather than GITHUB_TOKEN, so the version PR triggers CI: a
          # branch pushed with GITHUB_TOKEN raises no `pull_request` event, and
          # the required checks on that PR would never start. This token is for
          # git alone; the registry token below is never handed to git.
          token: ${{ secrets.RELEASE_PAT }}

      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: pnpm
          # npmjs, public. This writes the
          # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` line, so this
          # host has to match what `changeset publish` targets or the publish
          # goes out unauthenticated. `@codedocs/cli` carries
          # `publishConfig.access: public`, which is what makes a scoped package
          # publishable without a paid plan.
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Node refuses to strip types inside `node_modules`, so the published
      # package is a bundle and `dist/` has to exist before changesets publishes
      # it. `pnpm release` builds again for the same reason; this step is here
      # so a broken build fails before the version PR is touched.
      - name: Build
        run: pnpm build

      - name: Verify no package reaches the network
        run: pnpm check:network

      # With pending changesets: opens/updates the version PR.
      # With none (i.e. that PR just merged): publishes the versioned packages.
      - name: Create release PR or publish
        # Pinned to a commit SHA: changesets/action ships no immutable major tag,
        # so `@v2` tracks a moving branch head. Comment records the release pinned.
        uses: changesets/action@198f833dd7d863100ea6e28967bc9a9fdefadb0a # v2.1.0
        with:
          # v2 reads the token from this input only — setting a GITHUB_TOKEN env
          # var is silently ignored and the action falls back to the read-only
          # default token, which fails on "Resource not accessible by integration".
          github-token: ${{ secrets.RELEASE_PAT }}
          # `version-packages`, not a bare `changeset version`: changeset version
          # writes package.json only, so the lockfile would keep reporting the
          # previous version forever. The script re-syncs it.
          version-script: pnpm run version-packages
          publish-script: pnpm run release
          commit-message: 'chore: version packages'
          pr-title: 'changeset: cut release'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
